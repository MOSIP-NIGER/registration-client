name: Manual push trigger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_client:
    name: Build and push Registration Client 1.2.0.3
    runs-on: ubuntu-24.04
    env:
      NAMESPACE: ${{ secrets.DEV_NAMESPACE_DOCKER_HUB }}
      SERVICE_NAME: registration-client
      SERVICE_LOCATION: registration
      IMAGE_TAG: "1.2.0.3"

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: 'registration/**/pom.xml'

      - name: Configure Maven settings
        env:
          RELEASE_USER: ${{ secrets.RELEASE_USER }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          cat > "$GITHUB_WORKSPACE/settings.xml" <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>ossrh</id>
                <username>${RELEASE_USER}</username>
                <password>${RELEASE_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>allow-snapshots</id>
                <repositories>
                  <repository>
                    <id>snapshots-repo</id>
                    <url>https://oss.sonatype.org/content/repositories/snapshots</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>allow-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build with Maven
        run: |
          mvn -B package --file "$SERVICE_LOCATION/pom.xml" \
            -s "$GITHUB_WORKSPACE/settings.xml" \
            -DskipTests -Dgpg.skip=true

      - name: Build Docker image
        run: |
          docker build "$SERVICE_LOCATION" \
            --file "$SERVICE_LOCATION/Dockerfile" \
            --tag "$SERVICE_NAME:$IMAGE_TAG"

      - name: Check Docker Hub configuration
        env:
          DOCKER_USERNAME: ${{ secrets.ACTOR_DOCKER_HUB }}
          DOCKER_PASSWORD: ${{ secrets.RELEASE_DOCKER_HUB }}
        run: |
          test -n "$NAMESPACE" || { echo 'Missing secret: DEV_NAMESPACE_DOCKER_HUB'; exit 1; }
          test -n "$DOCKER_USERNAME" || { echo 'Missing secret: ACTOR_DOCKER_HUB'; exit 1; }
          test -n "$DOCKER_PASSWORD" || { echo 'Missing secret: RELEASE_DOCKER_HUB'; exit 1; }

      - name: Log into Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.ACTOR_DOCKER_HUB }}
          DOCKER_PASSWORD: ${{ secrets.RELEASE_DOCKER_HUB }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" --password-stdin

      - name: Tag and push image
        run: |
          IMAGE_ID=$(printf '%s/%s' "$NAMESPACE" "$SERVICE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag "$SERVICE_NAME:$IMAGE_TAG" "$IMAGE_ID:$IMAGE_TAG"
          docker push "$IMAGE_ID:$IMAGE_TAG"
          echo "Pushed Docker image: $IMAGE_ID:$IMAGE_TAG"